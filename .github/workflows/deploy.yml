name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # 1) Application code (incl. vendor) -> ~/rirenga.com/Rirenga/
      - name: Deploy app code (rsync over SSH)
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "./"
          TARGET: "~/rirenga.com/Rirenga/"
          ARGS: "-rlptDvz --no-perms --no-owner --no-group"
          EXCLUDE: ".git*, .github, node_modules, .env, .env.*, public, storage/logs, storage/framework/cache/data, storage/framework/sessions, storage/framework/views, tests"

      # 2) Built public assets -> ~/rirenga.com/ (document root)
      - name: Deploy public assets (rsync over SSH)
        uses: easingthemes/ssh-deploy@v5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.SSH_HOST }}
          REMOTE_USER: ${{ secrets.SSH_USER }}
          REMOTE_PORT: ${{ secrets.SSH_PORT }}
          SOURCE: "public/"
          TARGET: "~/rirenga.com/"
          ARGS: "-rlptDvz --no-perms --no-owner --no-group"
          EXCLUDE: "uploads, index.php, .htaccess"
