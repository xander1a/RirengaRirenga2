name: Deploy to Namecheap

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install composer dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      # 1) The application code goes to public_html/Rirenga/
      - name: Deploy app code
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.byizaecolodge.com
          username: byizhytz
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          timeout: 120000
          server-dir: ./rirenga.com/Rirenga/
          local-dir: ./
          state-name: .ftp-deploy-sync-state.json
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.*
            public/**
            storage/logs/**
            storage/framework/cache/data/**
            storage/framework/sessions/**
            storage/framework/views/**
            tests/**
            .ftp-deploy-sync-state.json

      # 2) The public folder contents go straight to public_html/ (the document root)
      - name: Deploy public assets to document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ftp.byizaecolodge.com
          username: byizhytz
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          timeout: 120000
          server-dir: ./rirenga.com/
          local-dir: ./public/
          state-name: .ftp-deploy-sync-state-public.json
          exclude: |
            uploads/**
            index.php
            .htaccess
            .ftp-deploy-sync-state-public.json
